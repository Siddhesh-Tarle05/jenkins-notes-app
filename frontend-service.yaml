apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: ClusterIP      # Internal traffic only (default type)
  selector:
    app: frontend    # <--- MUST MATCH the template.metadata.labels in your Deployment!
  ports:
    - protocol: TCP
      port: 80         # The port exposed by the service
      targetPort: 80   # The containerPort specified inside your Pod
