apiVersion: v1
kind: Service
metadata:
  name: backend-service # The name used for internal DNS routing
spec:
  type: ClusterIP      # Internal traffic only (default type)
  selector:
    app: backend      # <--- MUST MATCH the template.metadata.labels in your Deployment!
  ports:
    - protocol: TCP
      port: 3000        # The port exposed by the service
      targetPort: 3000   # The containerPort specified inside your Pod
